name: Release

# Push a version tag to publish a release:
#   git tag v0.2.0 && git push origin v0.2.0
# Or run it by hand from the Actions tab to get a draft build.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without the leading v), e.g. 0.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out with submodules
        uses: actions/checkout@v4
        with:
          # MediaServiceCore and SharedModules carry the YouTube API layer;
          # the build fails without them
          submodules: recursive
          fetch-depth: 0

      - name: Apply the submodule patches
        run: sh patches/apply.sh

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NAME="${{ github.event.inputs.version }}"
          else
            NAME="${GITHUB_REF_NAME#v}"
          fi

          # The versionCode must never go down or Android refuses to update. Derive it from
          # the version itself rather than the run number, which resets if the workflow is
          # renamed and says nothing about ordering: 0.3.1 -> 3001, 1.2.10 -> 1002010.
          # Leaves room for hand-built test APKs numbered between two releases.
          CORE="${NAME%%-*}"

          if ! echo "$CORE" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::Version '$NAME' is not major[.minor[.patch]], e.g. 0.4.0"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CORE"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          if [ "$MINOR" -gt 999 ] || [ "$PATCH" -gt 999 ]; then
            echo "::error::minor and patch must stay below 1000 (got $CORE)"
            exit 1
          fi

          CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $NAME (versionCode $CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The build pins exact versions; runners carry different ones preinstalled.
      # The NDK is only used to strip debug symbols from bundled .so files, but
      # without it the APKs come out noticeably larger.
      - name: Install the pinned SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;30.0.3" "ndk;21.0.6113669"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. See README for the setup steps."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # build.gradle reads this file; it never reaches the repo
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed APKs
        run: |
          chmod +x ./gradlew
          ./gradlew :smarttubedroid:assembleRelease --no-daemon \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Check the APKs really are signed
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in smarttubedroid/build/outputs/apk/release/*.apk; do
            echo "== $apk"
            "$BT/apksigner" verify --print-certs "$apk" | head -3
          done

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.keystore"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.name) || github.ref_name }}
          name: SmartTube Droid ${{ steps.version.outputs.name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: smarttubedroid/build/outputs/apk/release/*.apk
          body: |
            ## Install

            Download **`SmartTubeDroid_${{ steps.version.outputs.name }}_r_arm64-v8a.apk`** for any
            phone from roughly 2016 onward. If it will not install, use the `universal` build.

            Open the file on your phone and allow installing from unknown sources when asked.
            Requires Android 5.0 or newer.

            To get updates automatically, add this repository to
            [Obtainium](https://github.com/ImranR98/Obtainium).

            > Updating from an earlier build signed with a different key? Uninstall the old app
            > first — Android blocks updates when the signature changes.

      - name: Upload APKs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: smarttubedroid/build/outputs/apk/release/*.apk
          retention-days: 14
